spring:
  mvc:
    async:
      request-timeout: -1
  application:
    name: Horizon Pulsar
  lifecycle:
    timeout-per-shutdown-phase: ${PULSAR_GRACEFUL_SHUTDOWN_TIMEOUT:60000}ms

server:
  shutdown: graceful

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    de.telekom.horizon: ${HORIZON_LOG_LEVEL:INFO}

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    shutdown:
      enabled: true
  health:
    hazelcast:
      enabled: false
    mongo:
      enabled: false
  zipkin:
    tracing:
      endpoint: ${JAEGER_COLLECTOR_URL:http://jaeger-collector.example.com:9411}
  tracing:
    sampling:
      probability: ${ZIPKIN_SAMPLER_PROBABILITY:1.0}

pulsar:
  ssePollDelay: ${PULSAR_SSE_POLL_DELAY:1000}
  sseTimeout: ${PULSAR_SSE_TIMEOUT:60000}
  sseBatchSize: ${PULSAR_SSE_BATCH_SIZE:100}
  threadpool-size: ${PULSAR_THREADPOOL_SIZE:100}
  queue-capacity: ${PULSAR_QUEUE_CAPACITY:10000}
  features:
    eventDeliverySuppressed: ${PULSAR_EVENT_DELIVERY_SUPPRESSED:false}
    subscriberCheck: ${PULSAR_FEATURE_SUBSCRIBER_CHECK:true}
  security:
    issuerUrls: ${PULSAR_ISSUER_URL:http://localhost:8080/auth/realms/default}
    oauth: ${PULSAR_SECURITY_OAUTH:true}
  defaultEnvironment: ${PULSAR_DEFAULT_ENVIRONMENT:integration}

horizon:
  cache:
    enabled: true
    local-subscription-cache:
      enabled: ${PULSAR_CACHE_LOCAL_SUBSCRIPTION_CACHE_ENABLED:true}
      fallback-mode: ${PULSAR_CACHE_LOCAL_SUBSCRIPTION_CACHE_FALLBACK_MODE:hazelcast-with-mongo-fallback}
      snapshot-collection: ${PULSAR_CACHE_LOCAL_SUBSCRIPTION_CACHE_SNAPSHOT_COLLECTION:subscriptions.subscriber.horizon.telekom.de.v1-snapshots}
      head-collection: ${PULSAR_CACHE_LOCAL_SUBSCRIPTION_CACHE_HEAD_COLLECTION:subscriptions.subscriber.horizon.telekom.de.v1-head}
      stale-local-cache-read-grace-period: ${PULSAR_CACHE_LOCAL_SUBSCRIPTION_CACHE_STALE_LOCAL_CACHE_READ_GRACE_PERIOD:120s}
      require-local-cache-at-startup: ${PULSAR_CACHE_LOCAL_SUBSCRIPTION_CACHE_REQUIRE_LOCAL_CACHE_AT_STARTUP:false}
      initial-snapshot-timeout: ${PULSAR_CACHE_LOCAL_SUBSCRIPTION_CACHE_INITIAL_SNAPSHOT_TIMEOUT:15s}
      mongo-head-fallback-enabled: ${PULSAR_CACHE_LOCAL_SUBSCRIPTION_CACHE_MONGO_HEAD_FALLBACK_ENABLED:true}
      mongo-head-poll-jitter: ${PULSAR_CACHE_LOCAL_SUBSCRIPTION_CACHE_MONGO_HEAD_POLL_JITTER:10s}
      mongo-snapshot-sync-jitter: ${PULSAR_CACHE_LOCAL_SUBSCRIPTION_CACHE_MONGO_SNAPSHOT_SYNC_JITTER:10s}
      reconcile-interval: ${PULSAR_CACHE_LOCAL_SUBSCRIPTION_CACHE_RECONCILE_INTERVAL:60s}
      zoo-keeper:
        enabled: ${PULSAR_CACHE_LOCAL_SUBSCRIPTION_CACHE_ZOO_KEEPER_ENABLED:true}
        ensemble-tracker-enabled: ${PULSAR_CACHE_LOCAL_SUBSCRIPTION_CACHE_ZOO_KEEPER_ENSEMBLE_TRACKER_ENABLED:true}
        connect-string: ${PULSAR_CACHE_LOCAL_SUBSCRIPTION_CACHE_ZOO_KEEPER_CONNECT_STRING:}
        prepared-path: ${PULSAR_CACHE_LOCAL_SUBSCRIPTION_CACHE_ZOO_KEEPER_PREPARED_PATH:/horizon/subscriptions/prepared}
        activate-path: ${PULSAR_CACHE_LOCAL_SUBSCRIPTION_CACHE_ZOO_KEEPER_ACTIVATE_PATH:/horizon/subscriptions/activated}
        connection-timeout: ${PULSAR_CACHE_LOCAL_SUBSCRIPTION_CACHE_ZOO_KEEPER_CONNECTION_TIMEOUT:5s}
        session-timeout: ${PULSAR_CACHE_LOCAL_SUBSCRIPTION_CACHE_ZOO_KEEPER_SESSION_TIMEOUT:30s}
    kubernetesServiceDns: ${PULSAR_CACHE_SERVICE_DNS:localhost:5701}
    deDuplication:
      enabled: ${PULSAR_CACHE_DE_DUPLICATION_ENABLED:true}
      defaultCacheName: pulsar-deduplication
  kafka:
    bootstrapServers: ${PULSAR_KAFKA_BROKERS:kafka:9092}
    partitionCount: ${PULSAR_KAFKA_PARTITION_COUNT:10}
    groupId: ${PULSAR_KAFKA_GROUP_ID:pulsar}
    disableGroupId: true
    lingerMs: ${PULSAR_KAFKA_LINGER_MS:5}
    acks: ${PULSAR_KAFKA_ACKS:1}
    compression:
      enabled: ${PULSAR_KAFKA_COMPRESSION_ENABLED:false}
      type: ${PULSAR_KAFKA_COMPRESSION_TYPE:none}
  mongo:
    enabled: ${PULSAR_MONGO_ENABLED:true}
    url: ${PULSAR_MONGO_URL:mongodb://root:root@localhost:27017}
    databases:
      configTimeDatabase: ${PULSAR_MONGO_CONFIG_DATABASE:horizon-config}
      runTimeDatabase: ${PULSAR_MONGO_RUNTIME_DATABASE:horizon}
    collection: ${PULSAR_MONGO_COLLECTION:eventSubscriptions}
    rethrowExceptions: true

pandora:
  tracing:
    name: horizon




